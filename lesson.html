<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 자료실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 저장해 둔 밝기 설정을 그리기 전에 먼저 적용한다(화면이 번쩍이지 않도록).
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<header class="site-head">
  <div class="inner">
    <div class="head-row">
      <p class="eyebrow" id="crumb">Korean Lessons</p>
      <button class="theme-btn" id="themeBtn" type="button"></button>
    </div>
    <h1 class="site-title" id="title">불러오는 중…</h1>
    <p class="site-desc" id="desc"></p>
  </div>
</header>

<main class="wrap">
  <a class="back" href="index.html">&larr; 목록으로</a>
  <p class="print-title" id="printTitle"></p>
  <div id="content"></div>

  <footer class="site-foot">
    <span>한국어 자료실</span>
    <span id="meta"></span>
  </footer>
</main>

<script src="assets/app.js"></script>
</body>
</html>
